services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: admin-panel-app
    container_name: admin-panel-app
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    networks:
      - admin-panel-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: admin-panel-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - admin-panel-network
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    container_name: admin-panel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: admin_panel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - admin-panel-db-data:/var/lib/postgresql/data
    networks:
      - admin-panel-network

networks:
  admin-panel-network:
    driver: bridge

volumes:
  admin-panel-db-data:
